version: "3.9"

services:
  # SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthplus_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - healthplus_net

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: healthplus_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - healthplus_net

  # MailHog (dev SMTP + web UI)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: healthplus_mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - healthplus_net

  # Redis (cache + SignalR backplane - optional dev use)
  redis:
    image: redis:7-alpine
    container_name: healthplus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthplus_net

  # EasyOCR self-hosted fallback
  easyocr:
    image: jamesdwilson/easyocr:latest
    container_name: healthplus_easyocr
    ports:
      - "5001:5001"
    networks:
      - healthplus_net
    profiles:
      - ocr   # Only starts with: docker compose --profile ocr up

volumes:
  sqlserver_data:
  minio_data:
  redis_data:

networks:
  healthplus_net:
    driver: bridge
