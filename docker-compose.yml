version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: src/HealthCare.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver;Database=HealthPlusDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Storage__Endpoint: "http://minio:9000"
      Storage__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      Storage__BucketDocuments: health-documents
      Jwt__Issuer: "${JWT_ISSUER:-https://api.healthplus.vn}"
      Jwt__Audience: "${JWT_AUDIENCE:-https://healthplus.vn}"
      Email__Host: "${SMTP_HOST}"
      Email__Port: "587"
      Email__Username: "${SMTP_USER}"
      Email__Password: "${SMTP_PASS}"
      Email__FromAddress: "${SMTP_FROM}"
      Email__FromName: "Health+"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/health-plus
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqldata:
  minio_data:
