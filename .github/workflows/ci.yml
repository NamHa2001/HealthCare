name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore backend/HealthCare.sln

      - name: Build
        run: dotnet build backend/HealthCare.sln --no-restore -c Release

      - name: Unit Tests (Application)
        run: dotnet test backend/tests/HealthCare.Application.Tests/HealthCare.Application.Tests.csproj --no-build -c Release --logger "trx;LogFileName=app-tests.trx" --collect:"XPlat Code Coverage"

      - name: Integration Tests
        run: dotnet test backend/tests/HealthCare.Integration.Tests/HealthCare.Integration.Tests.csproj --no-build -c Release --logger "trx;LogFileName=int-tests.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: '**/*.trx'
          reporter: dotnet-trx

  frontend:
    name: Frontend — Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/health-plus/package-lock.json

      - name: Install
        working-directory: frontend/health-plus
        run: npm ci

      - name: Type check
        working-directory: frontend/health-plus
        run: npx tsc --noEmit

      - name: Build (production)
        working-directory: frontend/health-plus
        run: npm run build -- --configuration production

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t healthcare-api:${{ github.sha }} -f backend/src/HealthCare.API/Dockerfile backend/

      - name: Build Frontend image
        run: docker build -t healthcare-frontend:${{ github.sha }} -f frontend/health-plus/Dockerfile frontend/health-plus/
