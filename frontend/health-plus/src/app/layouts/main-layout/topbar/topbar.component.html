<header class="flex items-center justify-between h-16 px-6 bg-white shadow-sm shrink-0 z-10">

  <!-- Left: hamburger (mobile) -->
  <div class="flex items-center gap-3">
    <button mat-icon-button class="lg:hidden" (click)="toggleMenu()" aria-label="Mở menu">
      <mat-icon class="text-[#858796]">menu</mat-icon>
    </button>
    <span class="text-sm text-[#858796] hidden lg:block font-medium">Health+</span>
  </div>

  <!-- Right: notification + divider + user -->
  <div class="flex items-center gap-2">

    <button mat-icon-button matTooltip="Thông báo" aria-label="Thông báo">
      <mat-icon class="text-[#858796]">notifications_none</mat-icon>
    </button>

    <div class="w-px h-6 bg-gray-200 mx-1"></div>

    <!-- User info (hidden on mobile) -->
    <div class="hidden sm:flex flex-col items-end mr-2 leading-tight">
      <span class="text-xs font-semibold text-[#5a5c69]">{{ userFullName() }}</span>
      <span class="text-xs text-[#858796]">{{ roleLabel() }}</span>
    </div>

    <!-- Avatar + dropdown -->
    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Tài khoản">
      <div class="w-8 h-8 rounded-full bg-[#4e73df] flex items-center justify-center">
        <span class="text-white text-xs font-bold">{{ userInitials() }}</span>
      </div>
    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="px-4 py-3 border-b border-gray-100">
        <p class="text-sm font-semibold text-[#5a5c69]">{{ userFullName() }}</p>
        <p class="text-xs text-[#858796] truncate">{{ currentUser()?.email }}</p>
      </div>
      <button mat-menu-item routerLink="/settings">
        <mat-icon>manage_accounts</mat-icon>
        <span>Cài đặt tài khoản</span>
      </button>
      <mat-divider />
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Đăng xuất</span>
      </button>
    </mat-menu>

  </div>
</header>
