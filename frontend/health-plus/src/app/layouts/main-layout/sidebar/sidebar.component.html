<aside
  class="fixed inset-y-0 left-0 z-30 flex flex-col w-64
         bg-gradient-to-b from-[#4e73df] to-[#224abe]
         transition-transform duration-200 ease-in-out
         lg:relative lg:translate-x-0 lg:h-screen lg:shrink-0"
  [class.translate-x-0]="isOpen"
  [class.-translate-x-full]="!isOpen"
>
  <!-- Brand -->
  <div class="flex items-center justify-center h-16 px-6 border-b border-white/10 shrink-0">
    <div class="flex items-center gap-2">
      <mat-icon class="text-white">favorite</mat-icon>
      <span class="text-white font-bold text-xl tracking-tight">Health+</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-2">
    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="sidebar-nav-item"
        (click)="onNavClick()"
      >
        <mat-icon class="shrink-0" style="font-size:1.2rem;width:1.2rem;height:1.2rem">{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="px-6 py-3 border-t border-white/10 text-xs text-white/30 text-center shrink-0">
    Health+ v1.0
  </div>
</aside>
